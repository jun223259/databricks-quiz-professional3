<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Databricks Certified Data Engineer Professional — Practice Exam 3</title>
<style>
  :root{
    --ink:#131b23;
    --ink-soft:#4b5a68;
    --paper:#f2f4f6;
    --card:#ffffff;
    --line:#d7dee5;
    --ok:#0f6b4f;
    --ok-bg:#e6f3ed;
    --no:#9a3b32;
    --no-bg:#f6ebea;
    --mark:#1e4f7a;
    --shadow:0 1px 0 rgba(19,27,35,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15.5px;
    line-height:1.75;
  }
  header{
    background:var(--ink);
    color:#eef2f5;
    padding:34px 22px 26px;
  }
  .wrap{max-width:860px;margin:0 auto}
  h1{
    margin:0 0 6px;
    font-size:1.45rem;
    font-weight:700;
    letter-spacing:.01em;
    line-height:1.4;
  }
  .sub{margin:0;color:#9fb1c0;font-size:.85rem}
  .stats{margin-top:18px;display:flex;gap:26px;flex-wrap:wrap;font-size:.82rem;color:#9fb1c0}
  .stats b{color:#fff;font-size:1.5rem;font-weight:700;display:block;line-height:1.2}
  .controls{
    position:sticky;top:0;z-index:10;
    background:rgba(242,244,246,.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:12px 22px;
  }
  .ctl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=search]{
    flex:1;min-width:180px;
    padding:8px 12px;border:1px solid var(--line);border-radius:6px;
    background:#fff;font:inherit;font-size:.86rem;color:var(--ink);
  }
  input[type=search]:focus,button:focus-visible,.chip:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
  button{
    font:inherit;font-size:.82rem;cursor:pointer;
    padding:8px 14px;border-radius:6px;border:1px solid var(--line);
    background:#fff;color:var(--ink);
  }
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:26px 22px 90px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .qhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
  .qnum{font-size:1.05rem;font-weight:700;color:var(--mark)}
  .domain{
    font-size:.72rem;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:4px;padding:2px 8px;
  }
  .qtext{margin:0 0 16px;font-size:.97rem}
  .code-block{
    white-space:pre-wrap;word-break:break-word;
    font-family:'SFMono-Regular',Consolas,Menlo,monospace;
    font-size:.82rem;line-height:1.5;
    background:#f5f5f7;border:1px solid var(--line);border-radius:6px;
    padding:10px 12px;margin:8px 0;overflow-x:auto;display:block;
  }
  ol.opts{list-style:none;margin:0;padding:0;counter-reset:o}
  ol.opts li{
    counter-increment:o;
    border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;margin-bottom:9px;background:#fcfdfd;
  }
  li.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt-t{display:flex;gap:10px;font-size:.9rem}
  .opt-t::before{
    content:counter(o,upper-alpha);
    font-weight:700;color:var(--ink-soft);flex:none;
  }
  li.correct .opt-t::before{color:var(--ok)}
  .verdict{
    display:inline-block;margin-top:9px;font-size:.72rem;font-weight:700;
    padding:2px 8px;border-radius:4px;
  }
  .v-ok{background:var(--ok);color:#fff}
  .v-no{background:var(--no-bg);color:var(--no)}
  .exp{margin:7px 0 0;font-size:.85rem;color:var(--ink-soft)}
  .exp-ja{
    margin-top:5px;padding-left:10px;
    border-left:2px solid #c9d4de;color:#3d4f5f;
  }
  .ov-ja{
    margin:8px 0 0;padding-top:8px;
    border-top:1px dashed #c2d0dd;color:#33475a;
  }
  body.hide-answers .exp-ja{display:none}
  .card.shown .exp-ja{display:block!important}
  .overall{
    margin-top:16px;padding:14px 16px;border-left:3px solid var(--mark);
    background:#f4f7fa;border-radius:0 8px 8px 0;font-size:.88rem;
  }
  .overall h4{margin:0 0 6px;font-size:.76rem;color:var(--mark);font-weight:700}
  .jp{
    margin-top:12px;padding:12px 16px;border-radius:8px;
    background:#fff8ec;border:1px solid #f0e0c2;font-size:.88rem;
  }
  .jp h4{margin:0 0 4px;font-size:.76rem;color:#8a6a2c;font-weight:700}
  body.hide-answers li.correct{border-color:var(--line);background:#fcfdfd}
  body.hide-answers .verdict,
  body.hide-answers .exp,
  body.hide-answers .overall,
  body.hide-answers .jp{display:none}
  .reveal{margin-top:12px;display:none;font-size:.78rem;padding:6px 12px}
  .card.shown .reveal{background:var(--ink);color:#fff;border-color:var(--ink)}
  body.hide-answers .reveal{display:inline-block}
  .card.shown li.correct{border-color:var(--ok)!important;background:var(--ok-bg)!important}
  .card.shown .verdict,.card.shown .exp,.card.shown .overall,.card.shown .jp{display:block!important}
  .card.shown .verdict{display:inline-block!important}
  .empty{text-align:center;color:var(--ink-soft);padding:40px}
  @media print{
    .controls{display:none}
    body{background:#fff}
    .card{break-inside:avoid;box-shadow:none}
  }
</style>
</head>
<body class="hide-answers">
<header>
  <div class="wrap">
    <h1>Databricks Certified Data Engineer Professional<br>Practice Exam 3</h1>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="ctl-row">
      <input type="search" id="search" placeholder="キーワード検索（例: Auto Loader, CDF, ウォーターマーク）">
      <button id="toggle-ans" class="on">すべての解答を表示</button>
      <button id="expand-all" style="display:none">全部表示</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap" id="list"></div>
  <div class="wrap empty" id="empty" style="display:none">該当する問題がありません。</div>
</main>

<script>
const DATA = [
{
n:1, d:"Delta Lake",
q:"users テーブルの age 列に負の値が入っているのを見つけたため、ジュニアエンジニアが ALTER TABLE users ADD CONSTRAINT valid_age CHECK (age > 0); を実行しましたが失敗しました。原因を説明しているのはどれですか。",
o:[
 {t:"CHECK 制約を追加する構文が誤っている。正しくは ALTER TABLE users ADD CONSTRAINT ON COLUMN age (CHECK > 0) である", c:false, e:"そのような構文は存在しない。実際の構文自体は設問のとおりで問題ない。"},
 {t:"users テーブルには既にこの新しい制約に違反する行が含まれている。テーブルに追加する前に、既存のすべての行が制約を満たしている必要がある", c:true, e:"正解。ADD CONSTRAINT はテーブルに追加する前に既存の全行が制約を満たすか検証する。満たさない行があるとコマンドは失敗する。"},
 {t:"users テーブルには既に行が存在する。CHECK 制約は空のテーブルにしか追加できない", c:false, e:"空のテーブルである必要はない。既存行が制約を満たしていれば追加できる。"},
 {t:"users テーブルは既に存在している。CHECK 制約は CREATE TABLE 実行時にしか追加できない", c:false, e:"既存テーブルに対しても ALTER TABLE で追加できる。"}
],
ov:"ADD CONSTRAINT コマンドは、制約をテーブルへ追加する前に、テーブル内の既存のすべての行がその制約を満たすかを検証する。満たさない場合、テーブル内の一部の行が新しい CHECK 制約に違反しているというエラーでコマンドが失敗する。",
jp:"CHECK 制約の追加は『既存データの事後検証』を伴う。既存の負のage値をクリーンアップしてから制約を追加する必要がある、という運用上の順序を理解する。"
},
{
n:2, d:"パフォーマンス最適化",
q:"高トラフィックなサイトのクリックストリームイベント(user_id, timestamp, event_type, page_url)を、ユーザープロファイルデータセットと user_id で結合しています。少数のユーザーが大量のイベントを生成しているためデータスキューが発生し性能が大きく低下しています。このスキューを軽減する適切な方法でないものはどれですか。",
o:[
 {t:"結合時のシャッフルを避けるため、偏ったキーを全ワーカーノードへブロードキャストする", c:true, e:"正解(＝不適切)。ブロードキャストは通常、小さなルックアップデータセットをシャッフルなしで共有するために使う。偏ったキーをブロードキャストしても、関連データが大きければスキュー問題は解決せず、各エグゼキュータのメモリ圧をむしろ増やしうる。"},
 {t:"偏った user_id 値にランダムなプレフィックスを付けるソルティング(salting)で、パーティション間に負荷を分散する", c:false, e:"適切な方法。ホットキーを人為的に複数パーティションへ分散させ、シャッフル時のボトルネックを減らす。"},
 {t:"結合前にクリックストリームデータセットを user_id で再パーティションし、パーティション数を増やす", c:false, e:"適切な方法。パーティション数を増やすとデータ負荷が均等になり並列性が高まる。"},
 {t:"高頻度ユーザーを専用ジョブで扱うことで、偏ったキーの処理を分離する", c:false, e:"適切な方法。偏ったキーを結合処理全体から切り離し、専用のリソースで扱うことで性能を改善できる。"}
],
ov:"ブロードキャストは通常、シャッフルを伴う結合を避けるために小さなルックアップデータセットを全エグゼキュータへ共有するために使う。しかし偏ったキー(特にそれに紐づくデータが大きい場合)をブロードキャストしてもスキュー問題は解決せず、各エグゼキュータのメモリ圧をむしろ増大させうる。一方、ソルティング・再パーティション・偏ったキーの専用処理はいずれもスキュー軽減に有効な手法である。",
jp:"スキュー対策の定番：salting(ホットキーの分散)、repartition(パーティション増加)、偏ったキーの専用処理。broadcast は『大きなデータの偏ったキー』には効かない、という点が引っかけ。broadcastが有効なのは小さいテーブル全体をコピーする場合(Exam2 Q26)。"
},
{
n:3, d:"パフォーマンス最適化",
q:"OPTIMIZE コマンドを手動実行して Delta テーブルの小さいファイルを圧縮するとき、既定のターゲットファイルサイズはどれですか。",
o:[
 {t:"256 MB", c:false, e:"既定値ではない。"},
 {t:"1024 MB", c:true, e:"正解。既定値は1073741824バイト、つまり1GBに設定される。"},
 {t:"128 MB", c:false, e:"これは Auto Compaction の既定ターゲットサイズ(標準の OPTIMIZE ではない)。"},
 {t:"512 MB", c:false, e:"既定値ではない。"}
],
ov:"OPTIMIZE コマンドは小さいデータファイルをより大きなファイルへ圧縮する。既定値は1073741824であり、これは1GBのサイズを設定する。",
jp:"標準 OPTIMIZE＝1GB、Auto Compaction＝128MB(Exam1 Q46)。数字の対比をセットで覚える。"
},
{
n:4, d:"パフォーマンス最適化",
q:"パーティション化された Delta Lake テーブルで、ほとんどの一般的なクエリで大きな性能低下が起きています。OPTIMIZE コマンドを実行しても改善しませんでした。この遅延の原因として妥当なのはどれですか。",
o:[
 {t:"OPTIMIZE コマンドをテーブル全体に適用している。各パーティションに個別に適用する必要がある", c:false, e:"OPTIMIZE をパーティションごとに実行する必要はなく、それが根本原因でもない。"},
 {t:"テーブルが過剰に、あるいは誤ってパーティション化されている。これを解決するには全データファイルの完全な書き換えが必要", c:true, e:"正解。過剰・誤ったパーティション化では、ファイルはパーティション境界をまたいで結合・圧縮できないため、OPTIMIZE だけでは解決しない。全データファイルの完全な書き換えが必要になる。"},
 {t:"OPTIMIZE コマンドを ZORDER なしで適用している。パーティション列に Z-order が必要", c:false, e:"パーティション列自体に Z-order を適用しても、パーティション設計自体の問題は解決しない。"},
 {t:"テーブルに削除すべき古いデータファイルが多すぎる。代わりに VACUUM コマンドを実行する必要がある", c:false, e:"VACUUM は不要になった古いファイルの物理削除であり、パーティション設計の問題には対処しない。"}
],
ov:"過剰に、あるいは誤ってパーティション化されたデータは大きな悪影響を受ける。ファイルはパーティション境界をまたいで結合・圧縮できないため、パーティション化された小さなテーブルはストレージコストとスキャンすべきファイル総数を増やす。これがほとんどの一般的なクエリの遅延につながる。こうした問題を解決するには全データファイルの完全な書き換えが必要になる。",
jp:"Exam2 Q16(過剰パーティションの兆候)の続き。OPTIMIZEだけでは解決しない理由(パーティション境界をまたげない)を理解し、根本解決には再設計・完全書き換えが必要と知る。"
},
{
n:5, d:"Delta Lake",
q:"date, employee_id, rating の3列を持つ employees_performance テーブルへ、前日の従業員の生産性イベントを毎晩処理するバッチジョブを作ります。時系列で従業員の成績を比較できるようにデータを保存したい場合、正しいコードはどれですか。",
o:[
 {t:"performance_df.write.format(\"delta\").saveAsTable(\"employees_performance\")", c:false, e:"書き込みモードが既定(error/errorifexists)のままで、テーブルが既に存在するとエラーになる。"},
 {t:"performance_df.write.mode(\"append\").saveAsTable(\"employees_performance\")", c:true, e:"正解。date 列を持つこのテーブルでは、新しい日付のバッチごとに append モードで追記していくことで、時系列比較ができるようになる。"},
 {t:"performance_df.write.partitionBy(\"date\").saveAsTable(\"employees_performance\")", c:false, e:"パーティション化だけを指定しても書き込みモードが既定のままで、2回目以降の実行でエラーになる。"},
 {t:"performance_df.write.mode(\"overwrite\").saveAsTable(\"employees_performance\")", c:false, e:"overwrite では過去の日付のデータが失われ、時系列比較ができなくなる。"}
],
ov:"DataFrameWriter.mode は、データやテーブルが既に存在する場合の書き込み挙動を定義する。選択肢には append(既存データへ追記)、overwrite(既存データを上書き)、error/errorifexists(データが既に存在すればエラー、これが既定の保存モード)、ignore(データが既に存在すれば黙って何もしない)がある。employees_performance テーブルには date 列があるため、時系列で従業員の成績を比較できるようにするには、新しい日付を持つ各バッチのデータを append モードでテーブルへ追記すべきである。",
jp:"時系列比較(履歴を残したい)＝append。毎回上書き(最新状態だけでよい)＝overwrite。要件文の『compare across time(時系列比較)』という語がappendを選ぶ決め手。"
},
{
n:6, d:"ジョブ・ワークフロー",
q:"既存クラスターへノートブックをアタッチするために必要な最小限の権限はどれですか。",
o:[
 {t:"クラスターに対する「Can Manage」権限", c:false, e:"アタッチのみが目的ならこれは過剰な権限。"},
 {t:"クラスター作成権限＋クラスターに対する「Can Attach To」権限", c:false, e:"クラスター作成権限は既存クラスターへのアタッチには不要。"},
 {t:"クラスターに対する「Can Restart」権限", c:false, e:"アタッチだけなら Can Restart も過剰(起動・再起動・終了までできてしまう)。"},
 {t:"クラスターに対する「Can Attach To」権限", c:true, e:"正解。ノートブックをクラスターへアタッチするための最小権限。"}
],
ov:"クラスター権限には2種類ある。①「Allow cluster creation」entitlement はクラスターを作成できるかを制御する。②クラスターレベルの権限は特定クラスターの利用・変更を制御し、No Permissions / Can Attach To / Can Restart / Can Manage の4段階がある。ノートブックのアタッチのみが目的であれば Can Attach To が最小権限。",
jp:"4段階の権限がそれぞれ単独の設問として出る(Exam1 Q22＝Can Manage、Exam2 Q4＝Can Restart、Exam3 Q6・Q9)。目的(設定編集/起動/アタッチのみ)に応じた最小権限を素早く判定できるようにする。"
},
{
n:7, d:"ジョブ・ワークフロー",
q:"既存の Databricks ジョブを Declarative Automation Bundles(旧 Databricks Asset Bundles)で管理したい。CLI を使ってジョブの YAML 定義を取得し、参照されるアーティファクトをダウンロードするコマンドはどれですか。",
o:[
 {t:"databricks bundle download job --existing-job-id", c:false, e:"そのようなコマンドは存在しない。"},
 {t:"databricks bundle clone job --existing-job-id", c:false, e:"そのようなコマンドは存在しない。"},
 {t:"databricks bundle generate job --existing-job-id", c:true, e:"正解。ワークスペースに既に存在するリソースに対してバンドル構成を生成できる。ジョブ・パイプライン・アプリ・ダッシュボードの YAML 定義を生成し、参照するノートブックなどのアーティファクトも自動的にダウンロードする。"},
 {t:"databricks bundle get job --existing-job-id", c:false, e:"そのようなコマンドは存在しない。"}
],
ov:"正しいコマンドは databricks bundle generate である。これはワークスペースに既に存在するリソースに対してバンドル構成を生成できる。このプロセスはジョブ・パイプライン・アプリ・ダッシュボードの YAML 定義を生成し、参照するノートブックなどのアーティファクトを自動的にダウンロードする。",
jp:"既存リソースからバンドル定義を逆生成するコマンド：databricks bundle generate。DABs の新規作成(init)・デプロイ(deploy)・実行(run)・生成(generate)の各サブコマンドの用途を区別する。"
},
{
n:8, d:"Unity Catalog・ガバナンス",
q:"医療機関の patient_records テーブル(patient_id, name, department, diagnosis)で、医師だけが diagnosis 列の値を見られるようにマスクする UDF を作りたい場合、正しい関数はどれですか。",
o:[
 {t:"RETURN CASE WHEN is_account_group_member('diagnosis') THEN doctors ELSE 'CONFIDENTIAL' END;", c:false, e:"グループ名が 'diagnosis' になっており誤り。また引数名も doctors になっているなど、ロジックが列の意味と噛み合っていない。"},
 {t:"RETURN CASE WHEN is_account_group_member('doctors') THEN 'CONFIDENTIAL' ELSE diagnosis END;", c:false, e:"条件が逆。医師には 'CONFIDENTIAL' を返し、それ以外に実際の値を返してしまっている。"},
 {t:"RETURN CASE WHEN diagnosis IS NOT NULL THEN diagnosis ELSE 'CONFIDENTIAL' END;", c:false, e:"グループメンバーシップに基づかず、NULL かどうかで分岐しており要件を満たさない。"},
 {t:"RETURN CASE WHEN is_account_group_member('doctors') THEN diagnosis ELSE 'CONFIDENTIAL' END;", c:true, e:"正解。is_account_group_member('doctors') で現在のユーザーが doctors グループに属するかを確認し、属していれば実際の診断内容を、そうでなければ 'CONFIDENTIAL' を返す。"}
],
ov:"正しい関数は、is_account_group_member('doctors') 関数を使って現在のユーザーが「doctors」グループに属するかを確認することで、ロールベースのアクセス制御を適切に実装する。ユーザーが医師であれば実際の診断値を明らかにし、そうでなければ機微な患者情報を守るため diagnosis を 'CONFIDENTIAL' という文字列で置き換える。この方法は、認可された医療スタッフが必要な情報にアクセスできるようにしつつ、医療データのプライバシー要件への準拠を確保する。",
jp:"列マスク関数の型：CASE WHEN is_account_group_member('特権グループ') THEN 実値 ELSE マスク値 END。Exam1 Q32(行フィルタ)と対称の構造だが、行フィルタは真偽値、列マスクは値そのものを返す点が違う。"

n:17, d:"パフォーマンス最適化",
q:"データエンジニアリングチームが次のコードで3つの Delta テーブル間の結合を行っています。\n\ndf_students =  spark.table(\"students\")\ndf_courses =  spark.table(\"courses\")\ndf_enrollments =  spark.table(\"enrollments\")\n\ndf_join_1  = (df_students.join(df_enrollments, df_students.student_id == df_enrollments.student_id)\n                        .select(df_students.student_id,\n                                df_students.student_name,\n                                df_enrollments.course_id)\n              )\n\ndf_join_2 = (df_join_1.join(df_courses, df_join_1.course_id == df_courses.course_id)\n                       .select(df_join_1.student_id,\n                               df_join_1.student_name,\n                               df_courses.course_name)\n\t    )\n\n(df_join_2.write\n.mode(\"overwrite\")\n.table(\"students_courses_details\"))\n\nこのコードブロックを実行するたびに何が起きますか。",
o:[
 {t:"ソーステーブルの現バージョンの全レコードが結合操作の対象になる。一致しないレコードで students_courses_details テーブルが上書きされる", c:false, e:"デフォルトの join は inner join のため一致しない(unmatched)レコードは結果に含まれない。"},
 {t:"いずれかのソーステーブルに新しく追加されたレコードのみが結合操作の対象になる。一致したレコードで上書きされる", c:false, e:"spark.table() は静的な読み込みであり、テーブルの現バージョン全体を毎回読む。新規追加分のみを対象にはしない。"},
 {t:"ソーステーブルの現バージョンの全レコードが結合操作の対象になる。一致したレコードで students_courses_details テーブルが上書きされる", c:true, e:"正解。spark.table() は静的なテーブル読み込みであり、現バージョンの全レコードが対象になる。既定の inner join なので一致したレコードのみが結果となり、overwrite モードでテーブル全体が置き換わる。"},
 {t:"いずれかのソーステーブルに新しく追加されたレコードのみが対象になる。一致しないレコードで上書きされる", c:false, e:"新規追加分のみを対象にする挙動でも unmatched が結果になる挙動でもない。"}

ov:"このクエリは spark.table() 関数を使って3つの静的な Delta テーブルを読み込んでおり、これらのテーブルの現バージョンにあるすべてのレコードが読み込まれ、結合操作の対象になる。spark.table() と spark.read.table() 関数に違いはない。実際には spark.read.table() は内部で spark.table() を呼び出している。pyspark.sql.DataFrame.join() 関数は既定で内部結合(inner join)を実行するため、一致したレコードのみがターゲットテーブルへ書き込まれる。今回のクエリは「overwrite」モードでターゲットテーブルへ書き込んでおり、テーブルを完全に上書きする。",

q:"あるデータエンジニアが SDP で次のコードを使って CDC データを処理しています。\n\nCREATE OR REFRESH STREAMING TABLE cdc_target;\n\nCREATE FLOW cdc_flow AS AUTO CDC INTO users_target\nFROM stream(users_raw)\nKEYS (user_id)\nAPPLY AS DELETE WHEN operation = \"DELETE\"\nSEQUENCE BY updated_timestamp\nCOLUMNS *;\n\nこのコードを実行した後、users_target テーブルに加えて、メタストアに次の2つのオブジェクトが作成されていることに気づきました。\n・users_target という名前のビュー\n・__apply_changes_storage_users_target という名前のテーブル\n\nこれらのオブジェクトの目的を正しく説明しているのはどれですか。",
o:[
 {t:"users_target ビューは生データのマテリアライズされたスナップショットで、__apply_changes_storage_users_target は監査目的のユーザー活動ログを保存する", c:false, e:"監査ログの保存が目的ではない。"},
 {t:"これらのオブジェクトは、SEQUENCE BY を活用した内部の CDC 処理のために使われ、tombstone や版数といった、順序が乱れたデータを扱うために必要な追加情報を持つ", c:true, e:"正解。__apply_changes_storage_users_target は削除された行を示す『tombstone』マーカーとバージョニングのメタデータを保持し、順序が乱れた、あるいは遅れて到着したイベントを正しく適用できるようにする内部ストレージテーブル。users_target ビューはこの内部テーブルの上にある仮想レイヤーで、データの現在の状態をクリーンなクエリ可能なスナップショットとして提示する。"},
 {t:"users_target ビューはクエリを高速化するためのターゲットテーブルへの仮想インデックスであり、__apply_changes_storage_users_target は元の users_target インデックスのバックアップである", c:false, e:"インデックスやバックアップの仕組みではない。"},
 {t:"users_target ビューと __apply_changes_storage_users_target テーブルは書き込み最適化のために作られた一時オブジェクトであり、パイプライン実行後すぐに削除される", c:false, e:"一時オブジェクトではなく、CDC 処理の整合性維持に必須の永続的な内部オブジェクト。"}
],
ov:"SDP で APPLY AS DELETE や SEQUENCE BY のような操作を使って CDC フローを作成すると、システムは、シーケンスキーに基づいて正しい順序を保ちながら、挿入・更新・削除を含む増分更新を管理する仕組みを必要とする。__apply_changes_storage_users_target テーブルは、削除された行の『tombstone』マーカーとバージョニングのメタデータとともにこうした変更を追跡する内部ストレージテーブルであり、順序が乱れた、あるいは遅れて到着したイベントが正しく適用されることを保証する。この内部テーブルは直接クエリすることを意図したものではないが、CDC の一貫性を維持するために不可欠である。一方 users_target ビューは、この内部テーブルの上に置かれた仮想レイヤーで、データの現在の状態をクリーンでクエリ可能なスナップショットとして提示する。これにより CDC のロジックがカプセル化され透過的なまま保たれる。",
jp:"AUTO CDC が裏で作る2つの補助オブジェクトの役割：__apply_changes_storage_<table>(tombstone・バージョン管理を含む内部ストレージ)、<table>という名のビュー(現在状態のクリーンなスナップショット)。直接クエリするのはビューの方。"
},

const TRANS = {};

const list = document.getElementById('list');
const search = document.getElementById('search');
const toggleAns = document.getElementById('toggle-ans');

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmt(s){ const e = esc(s); return e.includes('\n') ? `<span class="code-block">${e}</span>` : e; }

function render(){
  const term = search.value.trim().toLowerCase();
  const rows = DATA.filter(item => {
    if (!term) return true;
    const blob = (item.q + item.ov + item.jp + item.o.map(o => o.t + o.e).join(' ')).toLowerCase();
    return blob.includes(term);
  });

  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  list.innerHTML = rows.map(item => {
    const tr = TRANS[item.n] || {};
    return `
    <article class="card" id="q${item.n}">
      <div class="qhead">
        <span class="qnum">Q${item.n}</span>
        <span class="domain">${esc(item.d)}</span>
      </div>
      <p class="qtext">${fmt(item.q)}</p>
      <ol class="opts">
        ${item.o.map((o, i) => `
          <li class="${o.c ? 'correct' : ''}">
            <div class="opt-t"><span>${fmt(o.t)}</span></div>
            <span class="verdict ${o.c ? 'v-ok' : 'v-no'}">${o.c ? '正解' : '誤り'}</span>
            <p class="exp">${esc(o.e)}</p>
            ${tr.o && tr.o[i] ? `<p class="exp exp-ja">${esc(tr.o[i])}</p>` : ''}
          </li>`).join('')}
      </ol>
      <button class="reveal" onclick="toggleCard(this)">解答を表示</button>
      <div class="overall"><h4>Overall explanation</h4>${esc(item.ov)}
        ${tr.ov ? `<p class="ov-ja">${esc(tr.ov)}</p>` : ''}
      </div>
      <div class="jp"><h4>覚えるポイント</h4>${esc(item.jp)}</div>
    </article>`;
  }).join('');
}

function toggleCard(btn){
  const card = btn.closest('.card');
  const shown = card.classList.toggle('shown');
  btn.textContent = shown ? '解答を隠す' : '解答を表示';
}

toggleAns.onclick = () => {
  const hidden = document.body.classList.toggle('hide-answers');
  toggleAns.textContent = hidden ? 'すべての解答を表示' : 'すべての解答を隠す';
  toggleAns.classList.toggle('on', hidden);
  document.querySelectorAll('.card.shown').forEach(c => c.classList.remove('shown'));
  document.querySelectorAll('.reveal').forEach(b => b.textContent = '解答を表示');
};
search.oninput = render;
render();
</script>
